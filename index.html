<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슈팅디스크 과학교실</title>
<style>
:root{
  --bg:#fff8ec; --ink:#2b2420; --muted:#7a6d62; --card:#ffffff; --line:#eadfce;
  --pri:#ff6b3d; --pri2:#ffb020; --blue:#2f8cff; --green:#22a95b; --red:#e5484d; --purple:#7c5cff;
  --wood:#c79a68; --wood2:#7a5534; --string:#2fa84f; --band:#e8b923;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
button{font:inherit;cursor:pointer;border:none}
input,select,textarea{font:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
.hidden{display:none!important}

/* layout */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line)}
#top .logo{font-weight:800;font-size:20px;color:var(--pri);white-space:nowrap}
#top .chip{background:#fff1e6;color:#a1461f;border-radius:99px;padding:4px 12px;font-size:15px;font-weight:700;white-space:nowrap}
#top .grow{flex:1}
#top .who{font-size:15px;color:var(--muted);white-space:nowrap}
.sync-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;margin-right:6px;vertical-align:middle}
.sync-dot.on{background:var(--green)}
#wrap{display:flex;min-height:calc(100vh - 58px)}
#nav{width:210px;flex:none;background:#fff;border-right:2px solid var(--line);padding:10px 8px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
#nav .grp{font-size:13px;font-weight:800;color:var(--muted);margin:12px 8px 4px}
#nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;padding:8px 10px;border-radius:12px;font-size:16px;color:var(--ink)}
#nav button:hover{background:#fff4e8}
#nav button.cur{background:var(--pri);color:#fff;font-weight:700}
#nav button.mine{outline:2px dashed var(--blue)}
#nav button:disabled{opacity:.45;cursor:default}
#main{flex:1;min-width:0;padding:22px 26px 90px}
#side{width:300px;flex:none;background:#fff;border-left:2px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1100px){#side{display:none}}
@media (max-width:860px){#nav{display:none}.grid2,.grid3{grid-template-columns:1fr}}
.title-xl{font-size:34px;font-weight:900}
.lead{font-size:20px;color:var(--muted)}
.big{font-size:22px}
.tag{display:inline-block;font-size:14px;font-weight:800;border-radius:99px;padding:3px 10px;background:#eef4ff;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 20px;font-weight:800;font-size:18px;background:var(--pri);color:#fff;box-shadow:0 3px 0 #c94a20}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c94a20}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #1e62b8}
.btn.green{background:var(--green);box-shadow:0 3px 0 #147a3f}
.btn.purple{background:var(--purple);box-shadow:0 3px 0 #5536d6}
.btn.sm{padding:7px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{background:#fff7d6;border:2px solid #f2dc8a;border-radius:14px;padding:12px 14px;margin:10px 0}
.warn{background:#ffecec;border:2px solid #f5b5b5;border-radius:14px;padding:12px 14px;margin:10px 0}
.good{background:#e8f8ee;border:2px solid #a8e0bd;border-radius:14px;padding:12px 14px;margin:10px 0}
.muted{color:var(--muted)}
.center{text-align:center}
.svgbox svg{width:100%;height:auto;display:block}

/* login */
.login{max-width:560px;margin:40px auto}
.login label{display:block;font-weight:700;margin:12px 0 4px}
.login input,.set input,.set select,.set textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:20px;background:#fff}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.rolepick button{background:#fff;border:3px solid var(--line);border-radius:22px;padding:26px 10px;font-size:24px;font-weight:900}
.rolepick button:hover{border-color:var(--pri)}
.rolepick .em{font-size:52px;display:block}

/* side panel */
.stat{display:flex;gap:8px;margin-bottom:10px}
.stat div{flex:1;background:#fff6ee;border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--ink)}
.stu{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line);font-size:15px}
.stu .nm{width:92px;flex:none;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .bar{flex:1;height:10px;background:#f0e8dc;border-radius:99px;overflow:hidden}
.stu .bar i{display:block;height:100%;background:var(--blue)}
.stu .st{width:54px;flex:none;text-align:right;font-size:18px}
.stu.help{background:#fff0f0}
.stu button{background:none;padding:0}

/* quiz */
.qwrap{max-width:980px;margin:0 auto}
.qnum{font-weight:900;color:var(--pri);font-size:18px}
.qtext{font-size:30px;font-weight:900;margin:6px 0 16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{position:relative;overflow:hidden;background:#fff;border:3px solid var(--line);border-radius:18px;padding:18px 18px;font-size:22px;font-weight:800;text-align:left;min-height:76px}
.choice .k{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#f3ece2;margin-right:10px;font-size:18px}
.choice:disabled{color:inherit;cursor:default}
.choice.counted{padding-right:84px}
.choice.picked{border-color:var(--blue);background:#eef5ff}
.choice.right{border-color:var(--green);background:#e8f8ee}
.choice.wrong{border-color:var(--red);background:#fff0f0}
.choice .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(47,140,255,.12);z-index:0}
.choice .lbl{position:relative;z-index:1}
.choice .cnt{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted);z-index:1}
.explain{font-size:20px}
@media (max-width:760px){.choices{grid-template-columns:1fr}.qtext{font-size:24px}}

/* build */
.steps-dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.steps-dots button{width:34px;height:34px;border-radius:50%;background:#f0e8dc;font-weight:800;font-size:15px}
.steps-dots button.done{background:var(--green);color:#fff}
.steps-dots button.cur{outline:3px solid var(--pri);outline-offset:2px}
.stepcard{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:22px;align-items:start}
@media (max-width:900px){.stepcard{grid-template-columns:1fr}}
.stepart{background:#f6f1e9;border-radius:18px;padding:10px}
.steptitle{font-size:28px;font-weight:900}
.steptext{font-size:22px;margin:8px 0}
.tip{font-size:18px;margin:6px 0;padding-left:28px;position:relative}
.tip:before{content:"💡";position:absolute;left:0}
.tip.w:before{content:"⚠️"}

/* sims */
.ctrl{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:#f3ece2;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:none;padding:9px 6px;border-radius:9px;font-weight:800;font-size:16px}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--pri)}
.ctrl label{font-weight:800;font-size:16px}
input[type=range]{width:100%;accent-color:var(--pri)}
.result{font-size:22px;font-weight:900;padding:12px 14px;border-radius:14px;text-align:center}
.result.ok{background:#e8f8ee;color:#137a3e}
.result.bad{background:#fff0f0;color:#b3262b}
.result.meh{background:#fff7d6;color:#8a6a00}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin var(--spd,1.2s) linear infinite}
.spin.ccw{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:8 8;animation:dash .6s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.shake{animation:shake .15s linear infinite}

/* contest */
table.rec{width:100%;border-collapse:collapse;font-size:18px}
table.rec th,table.rec td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
table.rec th{background:#fff6ee;font-size:15px}
table.rec input{width:80px;padding:6px;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:18px}
table.rec td.nm{text-align:left;font-weight:800}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:10px 0 18px}
.podium div{width:150px;border-radius:16px 16px 0 0;text-align:center;color:#fff;font-weight:900;padding:10px 6px}
.podium .p1{background:#f5b301;height:190px}
.podium .p2{background:#a7b1bd;height:150px}
.podium .p3{background:#c98a52;height:120px}
.podium .medal{font-size:40px}
.podium .pn{font-size:20px}
.podium .pv{font-size:26px}

/* status pick */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px;text-align:left;font-size:19px;font-weight:800}
.pick button.on{border-color:var(--pri);background:#fff4ec}
.pick .em{font-size:30px;margin-right:8px}
@media (max-width:760px){.pick{grid-template-columns:1fr}}

.fab{position:fixed;right:22px;bottom:20px;z-index:30;background:var(--red);color:#fff;font-weight:900;font-size:20px;border-radius:99px;padding:14px 22px;box-shadow:0 6px 18px rgba(229,72,77,.35)}
.fab.on{background:#fff;color:var(--red);border:3px solid var(--red)}
.wait{max-width:640px;margin:60px auto;text-align:center}
.wait .em{font-size:70px}
.timeline{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.timeline ol{margin:0;padding-left:22px}
.timeline li{margin:6px 0}
.timeline li b{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:grid;place-items:center;padding:20px}
.modal .card{max-width:640px;width:100%;max-height:90vh;overflow:auto}
.set label{display:block;font-weight:800;margin:12px 0 4px;font-size:16px}
.set input,.set select,.set textarea{font-size:17px;padding:9px 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2420;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:700}
.cmp td,.cmp th{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:18px}
.cmp th{background:#fff6ee;text-align:left}
.cmp{border-collapse:collapse;width:100%}
.feel button{font-size:44px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 18px}
.feel button.on{border-color:var(--pri);background:#fff4ec}
</style>
</head>
<body>
<div id="top">
  <div class="logo">🛸 슈팅디스크 과학교실</div>
  <span id="roomchip" class="chip hidden"></span>
  <div class="grow"></div>
  <span id="who" class="who"></span>
</div>
<div id="wrap">
  <nav id="nav" class="hidden"></nav>
  <main id="main"></main>
  <aside id="side" class="hidden"></aside>
</div>
<div id="fabHolder"></div>
<div id="modalHolder"></div>

<script>
/* =========================================================
   설정 — 실시간 연결을 쓰려면 Firebase 정보를 넣으세요.
   비워 두면 "혼자 모드"(한 컴퓨터 안에서만 동작)로 실행됩니다.
   ========================================================= */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyCTMV3MQiGfGMFJI6UBt6XD7OBWejmd2hU",
    authDomain: "shooting-disc.firebaseapp.com",
    databaseURL: "https://shooting-disc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shooting-disc",
    storageBucket: "shooting-disc.firebasestorage.app",
    messagingSenderId: "1046444051923",
    appId: "1:1046444051923:web:539392cbdf303c7ffc7326"
  },
  teacherPin: "1234"       // 교사 모드 비밀번호
};

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const keyOf = s => String(s).trim().replace(/[.#$\[\]\/\s]/g, "_");
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function setPath(obj, path, val){
  const parts = path.split("/").filter(Boolean); let o = obj;
  for(let i = 0; i < parts.length - 1; i++){ if(typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if(val === null || val === undefined) delete o[last]; else o[last] = val;
}

/* ---------- 동기화 (Firebase 또는 로컬) ---------- */
const Sync = {
  mode: "local", room: "", tree: {}, cbs: [], ref: null, bc: null, connected: false, _r: null,
  first: null,
  fbReady(){ const f = CONFIG.firebase; return !!(f && f.apiKey && f.databaseURL); },
  loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); },
  async init(room){
    this.room = keyOf(room);
    this.first = new Promise(r => { this._r = r; setTimeout(r, 6000); });
    if(this.fbReady()){
      try{
        await this.loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
        await this.loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
        if(!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
        this.mode = "firebase";
        this.ref = firebase.database().ref("rooms/" + this.room);
        this.ref.on("value", snap => { this.tree = snap.val() || {}; this._r && this._r(); this.emit(); }, err => { toast("연결 오류: " + err.message); });
        firebase.database().ref(".info/connected").on("value", s => { this.connected = !!s.val(); updateTop(); });
        return;
      }catch(e){ console.warn("Firebase 실패 → 로컬 모드", e); toast("실시간 연결을 못 해서 혼자 모드로 실행해요"); }
    }
    this.mode = "local";
    this.connected = true;
    const k = "sd_room_" + this.room;
    this.tree = LS.get(k, {});
    try{ this.bc = new BroadcastChannel(k); this.bc.onmessage = () => { this.tree = LS.get(k, {}); this.emit(); }; }catch(e){}
    window.addEventListener("storage", ev => { if(ev.key === k){ this.tree = LS.get(k, {}); this.emit(); } });
    this._r();
    setTimeout(() => this.emit(), 0);
  },
  set(path, val){
    if(this.mode === "firebase"){ this.ref.child(path).set(val === undefined ? null : val); return; }
    const k = "sd_room_" + this.room;
    this.tree = LS.get(k, {});
    setPath(this.tree, path, val);
    LS.set(k, this.tree);
    if(this.bc) this.bc.postMessage(1);
    this.emit();
  },
  on(cb){ this.cbs.push(cb); },
  emit(){ this.cbs.forEach(cb => cb(this.tree)); }
};

/* ---------- 수업 구성 (챕터) ---------- */
const CHAPTERS = [
  {id:"welcome",  grp:"1교시", icon:"👋", name:"시작"},
  {id:"intro",    grp:"1교시", icon:"🗺️", name:"수업 소개"},
  {id:"lift",     grp:"1교시", icon:"🌬️", name:"원리① 왜 뜰까?"},
  {id:"compare",  grp:"1교시", icon:"🌀", name:"원리② 프로펠러 비교"},
  {id:"direction",grp:"1교시", icon:"🔄", name:"원리③ 방향 실험실"},
  {id:"quiz",     grp:"1교시", icon:"❓", name:"퀴즈"},
  {id:"guide",    grp:"1교시", icon:"📋", name:"조립 약속"},
  {id:"build",    grp:"1교시", icon:"🔧", name:"조립하기"},
  {id:"test",     grp:"1교시", icon:"🚀", name:"첫 비행 & 고치기"},
  {id:"decorate", grp:"1교시", icon:"🎨", name:"꾸미기"},
  {id:"rules",    grp:"2교시", icon:"🦺", name:"대회 규칙"},
  {id:"contest",  grp:"2교시", icon:"🏆", name:"멀리 보내기 대회"},
  {id:"mission",  grp:"2교시", icon:"🔬", name:"과학자 미션"},
  {id:"finale",   grp:"2교시", icon:"🚁", name:"마무리 & 드론"}
];
const chIndex = id => CHAPTERS.findIndex(c => c.id === id);

/* ---------- 퀴즈 ---------- */
const QUIZ = [
  {q:"이 슈팅디스크는 하늘로 날아오를까요?", scene:{dir:1, fold:-1, angle:35},
   c:["날아올라요","받침에 붙어서 돌기만 해요","거꾸로 아래로 떨어져요"], a:0,
   e:"날개의 접힌 쪽이 뒤따라오고 있어요. 날개가 공기를 아래로 밀어내니까 원반은 위로 날아올라요!"},
  {q:"슈팅디스크가 위로 뜨는 까닭은 무엇일까요?",
   c:["돌아가는 날개가 공기를 아래로 밀어서","고무줄이 원반을 위로 튕겨서","원반이 가벼워서 저절로","바람이 불어서"], a:0,
   e:"공기를 아래로 밀면, 공기도 원반을 위로 밀어 줘요. 헬리콥터와 드론도 같은 원리예요."},
  {q:"실을 반대로 감았어요. 이번에는 어떻게 될까요?", scene:{dir:-1, fold:-1, angle:35},
   c:["더 높이 날아요","받침에 붙어서 돌기만 해요","옆으로 날아가요"], a:1,
   e:"도는 방향이 바뀌면 날개가 공기를 위로 밀어요. 그러면 원반은 오히려 아래로 눌려서 받침에 붙어 버려요."},
  {q:"원반이 받침에 붙어서 빙글빙글 돌기만 해요. 어떻게 고칠까요?",
   c:["실을 반대 방향으로 다시 감는다","더 살살 당긴다","원반에 스티커를 더 붙인다","고무줄을 뺀다"], a:0,
   e:"도는 방향과 날개 방향이 서로 반대라서 그래요. 실을 반대로 감으면 방향이 맞아서 날아올라요!"},
  {q:"날개를 접지 않고 평평하게 두면 어떻게 될까요?", scene:{dir:1, fold:-1, angle:0},
   c:["빙글빙글 돌기만 하고 뜨지 않아요","더 높이 날아요","거꾸로 돌아요"], a:0,
   e:"평평한 날개는 공기를 아래로 밀지 못해요. 날개가 비스듬해야 공기를 밀어낼 수 있어요."},
  {q:"플라잉 프로펠러와 슈팅디스크의 같은 점은?",

/* ---------- 비행 시뮬레이터 계산 ---------- */
function flight({dir, fold, angle, power}){
  const match = fold === -dir;
  if(angle < 3) return {match, h:0, kind:"flat", msg:"빙글빙글 돌기만 하고 뜨지 않아요", cls:"meh"};
  if(!match) return {match, h:0, kind:"press", msg:"받침에 꾹 눌려서 돌기만 해요!", cls:"bad"};
  const rad = angle * Math.PI / 180;
  const lift = power * power * Math.sin(2 * rad) * Math.cos(rad) * 2.6;
  const h = Math.max(0, lift - 0.35);
  if(h <= 0.02) return {match, h:0, kind:"weak", msg:"살짝 들썩이다 떨어져요. 더 세게!", cls:"meh"};
  const steep = angle > 60;

      <label>반 코드 (학생들에게 알려 줄 코드)</label><input id="tRoom" placeholder="예: 3-1" value="${esc(roomPre)}">
      <label>교사 비밀번호</label><input id="tPin" type="password" placeholder="비밀번호">
      <div class="row" style="margin-top:18px"><button class="btn sec" data-act="back">◀ 뒤로</button><button class="btn" style="flex:1" data-act="jointeach">들어가기 ▶</button></div>
    </div></div>`;
}
async function enter(r){
  role = r.role;
  if(role === "student") me = {id: keyOf((r.num ? r.num + "_" : "") + r.name), name: r.name, num: r.num};
  LS.set("sd_me", r);
  await Sync.init(r.room);
  await Sync.first; tree = Sync.tree;
  $("#roomchip").textContent = "반 코드: " + r.room; $("#roomchip").classList.remove("hidden");
  if(role === "student"){
    const sv = LS.get("sd_view_" + Sync.room + "_" + me.id, null); if(sv) studentView = sv;
    const ex = (Sync.tree.students || {})[me.id];
    if(!ex) Sync.set("students/" + me.id, {name: me.name, num: me.num || "", step: 0, joined: Date.now()});
    else { Sync.set("students/" + me.id + "/name", me.name); }
  } else {
    if(!Sync.tree.state) Sync.set("state", {chapter:"welcome", follow:true, quiz:{idx:0, open:false, reveal:false}, quizF:{idx:7, open:false, reveal:false}, settings: DEFAULT_SETTINGS});
  }
  updateTop();
  render(true);
}
function updateTop(){
  const w = $("#who");
  if(!role){ w.innerHTML = ""; return; }
  const dot = `<span class="sync-dot ${Sync.connected ? "on" : ""}"></span>${Sync.mode === "firebase" ? (Sync.connected ? "실시간 연결됨" : "연결 중…") : "혼자 모드"}`;
  w.innerHTML = `${dot} · ${role === "teacher" ? "🧑‍🏫 선생님" : "🧒 " + esc((me.num ? me.num + "번 " : "") + me.name)} <button class="btn sm sec" data-act="logout" style="margin-left:8px">나가기</button>`;
}

/* ---------- 렌더 ---------- */
let pendingRender = false, lastKey = "";
function viewKey(){
  const ch = curChapter();
  const st = S();
  const base = {ch, tp: teacherPresent(), set: st.settings, follow: st.follow, role, sv: role === "student" ? studentView : null, sim: simState};
  if(ch === "quiz") base.q = {quiz: st.quiz, stu: role === "teacher" ? Object.values(students()).map(s => s.quiz) : myRec().quiz};
  if(ch === "build") base.b = role === "teacher" ? Object.values(students()).map(s => s.step) : myRec().step;
  if(ch === "test") base.t = role === "teacher" ? Object.values(students()).map(s => [s.name, s.status]) : myRec().status;
  if(ch === "contest") base.c = Object.values(students()).map(s => [s.name, s.num, s.rec]);
  if(ch === "mission") base.m = role === "teacher" ? Object.values(students()).map(s => s.mission) : myRec().mission;
  if(ch === "finale") base.f = {feel: role === "teacher" ? Object.values(students()).map(s => s.feel) : myRec().feel, qf: st.quizF, stu: role === "teacher" ? Object.values(students()).map(s => s.quiz && s.quiz.q7) : (myRec().quiz && myRec().quiz.q7)};
  return JSON.stringify(base);
}
function render(force){
  if(!role){ renderLogin(); return; }
  const ae = document.activeElement;
  if(!force && ae && ae.matches && ae.matches("#main input[type=number], #main input[type=text], #modalHolder input, #modalHolder textarea")){ pendingRender = true; renderSide(); renderNav(); return; }
  renderNav(); renderSide(); renderFab();
  const key = viewKey();
  if(!force && key === lastKey) return;
  lastKey = key;
  const ch = curChapter();
  const f = V[ch] || V.welcome;
  let html = f();
  if(following()){
    html = `<div class="note" style="margin-top:0">👀 선생님 화면을 따라가고 있어요.</div>` + html;
  }
  $("#main").innerHTML = html;
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll("#main [data-ty]").forEach(el => { el.style.transform = "translateY(" + el.dataset.ty + "px)"; })));
}
document.addEventListener("focusout", () => setTimeout(() => {
  const ae = document.activeElement;
  if(ae && ae.matches && ae.matches("#main input[type=number], #main input[type=text], #modalHolder input, #modalHolder textarea")) return;
  if(pendingRender){ pendingRender = false; render(); }
}, 80));

function renderNav(){
  const nav = $("#nav");
  const locked = following();
  nav.classList.remove("hidden");
  const cur = curChapter();
  let html = "", g = "";
  CHAPTERS.forEach(c => {
    if(c.grp !== g){ g = c.grp; html += `<div class="grp">${g}</div>`; }
    html += `<button data-act="goch" data-v="${c.id}" class="${c.id === cur ? "cur" : ""}" ${locked && c.id !== cur ? "disabled" : ""}>${c.icon} ${c.name}</button>`;
  });
  if(role === "teacher"){
    const st = S();
    html += `<div class="grp">수업 도구</div>
      <button data-act="follow">${st.follow !== false ? "🔒 학생: 선생님 따라오기" : "🔓 학생: 자유 이동"}</button>
      <button data-act="settings">⚙️ 설정</button>
      <button data-act="copylink">🔗 학생 접속 링크 복사</button>
      <button data-act="resetroom">🧹 반 기록 초기화</button>`;
  }
  nav.innerHTML = html;
}
function renderSide(){
  const side = $("#side");
  if(role !== "teacher"){ side.classList.add("hidden"); return; }
  side.classList.remove("hidden");
  const arr = Object.entries(students()).map(([id, s]) => ({id, ...s})).sort((a, b) => (b.help ? 1 : 0) - (a.help ? 1 : 0) || (Number(a.num) || 999) - (Number(b.num) || 999));
  const help = arr.filter(s => s.help).length, fly = arr.filter(s => s.status === "fly").length;
  side.innerHTML = `<h3>👥 학생 현황</h3>
    <div class="stat"><div><b>${arr.length}</b>접속</div><div><b style="color:var(--red)">${help}</b>도움 요청</div><div><b style="color:var(--green)">${fly}</b>비행 성공</div></div>
    ${Sync.mode === "local" ? `<div class="note" style="font-size:14px">혼자 모드: 같은 컴퓨터의 다른 탭에서 연 학생 화면만 보여요. 반 전체 연결은 설정 안내를 보세요.</div>` : ""}
    ${arr.map(s => {
      const pct = Math.min(100, Math.round((s.step || 0) / STEPS.length * 100));
      const qn = s.quiz ? Object.entries(s.quiz).filter(([k, v]) => QUIZ[k.slice(1)] && QUIZ[k.slice(1)].a === v).length : 0;
      return `<div class="stu ${s.help ? "help" : ""}"><span class="nm" title="${esc(s.name)}">${esc((s.num ? s.num + " " : "") + s.name)}</span>
        <span class="bar" title="조립 ${s.step || 0}/${STEPS.length}"><i style="width:${pct}%"></i></span>
        <span class="st">${s.help ? `<button data-act="clearhelp" data-v="${esc(s.id)}" title="도움 완료로 표시">🙋</button>` : ""}${s.status ? STATUS[s.status].em : ""}<small title="퀴즈 정답 수">${qn ? "⭐" + qn : ""}</small></span></div>`;
    }).join("") || `<div class="muted">아직 접속한 학생이 없어요.</div>`}`;
}
function renderFab(){
  const h = $("#fabHolder");
  if(role !== "student"){ h.innerHTML = ""; return; }
  const on = !!myRec().help;
  h.innerHTML = `<button class="fab ${on ? "on" : ""}" data-act="help">${on ? "⏳ 선생님이 오고 있어요 (취소)" : "🙋 도와주세요"}</button>`;
}

/* ---------- 확인/입력 창 (페이지 안 대화상자) ---------- */
function dlg(msg, withInput, value){
  return new Promise(res => {
    const h = $("#modalHolder");
    h.innerHTML = `<div class="modal"><div class="card set"><div class="big" style="white-space:pre-line">${esc(msg)}</div>
      ${withInput ? `<input id="dlgIn" value="${esc(value || "")}" style="margin-top:12px">` : ""}
      <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn sec" id="dlgNo">취소</button><button class="btn" id="dlgOk">확인</button></div></div></div>`;
    const done = v => { h.innerHTML = ""; res(v); };
    $("#dlgNo").onclick = () => done(withInput ? null : false);
    $("#dlgOk").onclick = () => done(withInput ? $("#dlgIn").value : true);
    if(withInput){ const i = $("#dlgIn"); i.focus(); i.select(); i.onkeydown = e => { if(e.key === "Enter"){ e.stopPropagation(); done(i.value); } }; }
  });
}
const askConfirm = m => dlg(m, false), askText = (m, v) => dlg(m, true, v);

/* ---------- 설정 창 ---------- */
function openSettings(){
  const st = getSettings();
  $("#modalHolder").innerHTML = `<div class="modal"><div class="card set">
    <h2>⚙️ 수업 설정</h2>
    <label>강사 이름</label><input id="sIns" value="${esc(st.instructor)}" placeholder="예: 홍길동">
    <label>강사 소개 (수업 소개 화면에 보여요)</label><textarea id="sIntro" rows="3" placeholder="예: 드론과 코딩을 가르치는 선생님이에요.">${esc(st.intro)}</textarea>
    <label>실 감는 방향 (위에서 내려다볼 때)</label>
    <select id="sWind"><option value="cw" ${st.wind === "cw" ? "selected" : ""}>시계방향 ↻ (교안 표기)</option><option value="ccw" ${st.wind === "ccw" ? "selected" : ""}>반시계방향 ↺</option></select>
    <div class="note" style="font-size:15px">수업 전에 시범용 슈팅디스크로 잘 나는 방향을 확인하고 맞춰 주세요. 조립 화면과 그림이 이 방향으로 바뀌어요.</div>
    <label>원반 접기 그림 방향 (시범용 원반을 위에서 본 모습과 같은 쪽 선택)</label>
    <div class="row" style="flex-wrap:nowrap">
      <label style="flex:1;text-align:center;font-weight:700"><input type="radio" name="sFold" value="A" ${st.foldPic !== "B" ? "checked" : ""} style="width:auto"> A<br>${discTop({fold:-1, arrows:false, size:150})}</label>
      <label style="flex:1;text-align:center;font-weight:700"><input type="radio" name="sFold" value="B" ${st.foldPic === "B" ? "checked" : ""} style="width:auto"> B<br>${discTop({fold:1, arrows:false, size:150})}</label></div>
    <label>대회 기록 단위</label><input id="sUnit" value="${esc(st.unit)}" placeholder="m, 걸음, 칸 등">
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn sec" data-act="closemodal">취소</button><button class="btn" data-act="savesettings">저장</button></div>
  </div></div>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  const sStu = (path, val) => Sync.set("students/" + me.id + "/" + path, val);
  switch(a){
    case "pickstu": $("#step1").classList.add("hidden"); $("#stuForm").classList.remove("hidden"); $("#fRoom").value ? $("#fNum").focus() : $("#fRoom").focus(); break;
    case "pickteach": $("#step1").classList.add("hidden"); $("#teachForm").classList.remove("hidden"); $("#tRoom").focus(); break;
    case "back": renderLogin(); break;
    case "resume": enter(LS.get("sd_me")); break;
    case "joinstu": {
      const room = $("#fRoom").value.trim(), num = $("#fNum").value.trim(), name = $("#fName").value.trim();
      if(!room || !name){ toast("반 코드와 이름을 넣어 주세요"); return; }
      enter({role:"student", room, num, name}); break; }
    case "jointeach": {
      const room = $("#tRoom").value.trim();
      if(!room){ toast("반 코드를 넣어 주세요"); return; }
      if($("#tPin").value !== CONFIG.teacherPin){ toast("비밀번호가 달라요"); return; }
      enter({role:"teacher", room}); break; }
    case "logout": if(await askConfirm("나갈까요?")){ localStorage.removeItem("sd_me"); location.href = location.pathname + (Sync.room ? "?room=" + encodeURIComponent(Sync.room) : ""); } break;
    case "goch":
      if(role === "teacher") Sync.set("state/chapter", v);
      else { studentView.ch = v; saveView(); render(true); }
      window.scrollTo(0, 0); break;
    case "follow": Sync.set("state/follow", S().follow === false); break;
    case "settings": openSettings(); break;
    case "closemodal": $("#modalHolder").innerHTML = ""; break;
    case "savesettings":
      Sync.set("state/settings", {instructor: $("#sIns").value.trim(), intro: $("#sIntro").value.trim(), wind: $("#sWind").value, foldPic: (document.querySelector('input[name=sFold]:checked') || {}).value || "A", unit: $("#sUnit").value.trim() || "m"});
      simState.dir = null; $("#modalHolder").innerHTML = ""; toast("저장했어요"); setTimeout(() => render(true), 30); break;
    case "copylink": {
      const url = location.origin + location.pathname + "?room=" + encodeURIComponent(Sync.room);
      try{ await navigator.clipboard.writeText(url); toast("복사했어요: " + url); }catch(e){ askText("이 주소를 복사해서 학생들에게 보내 주세요", url); }
      break; }
    case "resetroom":
      if(await askConfirm("이 반의 학생 접속·퀴즈·기록을 모두 지울까요?\n되돌릴 수 없어요.")){ Sync.set("students", null); Sync.set("state/quiz", {idx:0, open:false, reveal:false}); Sync.set("state/quizF", {idx:7, open:false, reveal:false}); toast("초기화했어요"); }
      break;
    case "clearhelp": Sync.set("students/" + v + "/help", null); break;
    case "help": sStu("help", myRec().help ? null : Date.now()); break;
    /* 시뮬레이션 */
    case "liftspin": simState.lift.spin = !simState.lift.spin; render(); break;
    case "cmpA": simState.cmp.a = simState.cmp.a === "go" ? "idle" : "go"; render(); break;
    case "cmpB": simState.cmp.b = simState.cmp.b === "go" ? "idle" : "go"; render(); break;
    case "dirset": dirReset(); simState.dir.dir = Number(v); render(); break;
    case "foldset": dirReset(); simState.dir.fold = Number(v); render(); break;
    case "stopspin": dirStop(); break;
    case "launch":
      dirReset(); render();
      setTimeout(() => {
        const d = simState.dir, f = flight(d);
        d.launched = true; d.spinning = true; d.run = (d.run || 0) + 1;
        d.lastLift = f.kind === "fly" ? -(40 + f.h * 150) : (f.kind === "weak" ? -12 : 0);
        const run = d.run; render();
        clearTimeout(d.tid); d.tid = setTimeout(() => { if(simState.dir && simState.dir.run === run && simState.dir.spinning) dirStop(); }, 4000);
      }, 60); break;
    /* 퀴즈 */
    case "answer":
      if(role !== "student") break;
      sStu("quiz/q" + qIdx(b.dataset.k || "quiz"), Number(v)); break;
    case "qprev": case "qnext": {
      const k = b.dataset.k, c = QCFG[k], cur = qIdx(k);
      const n = a === "qprev" ? Math.max(c.start, cur - 1) : Math.min(c.end, cur + 1);
      Sync.set("state/" + k, {idx: n, open:false, reveal:false}); break; }
    case "qopen": { const k = b.dataset.k, qs = S()[k] || {}; Sync.set("state/" + k + "/idx", qIdx(k)); Sync.set("state/" + k + "/open", !qs.open); break; }
    case "qreveal": { const k = b.dataset.k, qs = S()[k] || {}; Sync.set("state/" + k + "/idx", qIdx(k)); Sync.set("state/" + k + "/reveal", !qs.reveal); if(!qs.open) Sync.set("state/" + k + "/open", true); break; }
    case "qlive": { const k = b.dataset.k, qs = S()[k] || {}; Sync.set("state/" + k + "/showLive", !qs.showLive); break; }
    case "sqprev": case "sqnext": {
      const k = b.dataset.k, c = QCFG[k], cur = qIdx(k);
      simState["qidx_" + k] = a === "sqprev" ? Math.max(c.start, cur - 1) : Math.min(c.end, cur + 1); render(); break; }
    /* 조립 */
    case "gostep":
      if(role === "student"){ studentView.step = Number(v); saveView(); } else simState.tstep = Number(v);
      render(); break;
    case "prevstep":
      if(role === "student"){ studentView.step = Math.max(0, studentView.step - 1); saveView(); } else simState.tstep = Math.max(0, (simState.tstep || 0) - 1);
      render(); break;
    case "nextstep": simState.tstep = Math.min(STEPS.length - 1, (simState.tstep || 0) + 1); render(); break;
    case "donestep": {
      const cur = studentView.step;
      if((myRec().step || 0) < cur + 1) sStu("step", cur + 1);
      if(cur < STEPS.length - 1){ studentView.step = cur + 1; saveView(); render(true); }
      else { studentView.ch = "test"; saveView(); render(true); }
      window.scrollTo(0, 0); break; }
    /* 비행 */
    case "status": sStu("status", v || null); break;
    /* 대회 */
    case "addstu": {
      const n = await askText("학생 이름 (번호가 있으면 '7 김제주'처럼)"); if(!n) break;
      const m = n.trim().match(/^(\d+)\s+(.+)$/); const num = m ? m[1] : "", name = m ? m[2] : n.trim();
      Sync.set("students/" + keyOf((num ? num + "_" : "") + name), {name, num, step:0, joined:Date.now(), manual:true}); break; }
    case "resetrec": if(await askConfirm("대회 기록을 모두 지울까요?")) Object.keys(students()).forEach(id => Sync.set("students/" + id + "/rec", null)); break;
    /* 미션 */
    case "mp": sStu("mission/" + b.dataset.m + "/p", Number(v)); break;
    case "mr": sStu("mission/" + b.dataset.m + "/r", Number(v)); break;
    case "feel": sStu("feel", v); break;
  }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.dataset.act === "angle"){ dirReset(); simState.dir.angle = Number(t.value); $("#angv").textContent = t.value + "°"; clearTimeout(t._t); t._t = setTimeout(() => { render(); const el = document.querySelector('[data-act="angle"]'); if(el) el.focus(); }, 250); }
  if(t.dataset.act === "power"){ dirReset(); simState.dir.power = Number(t.value); const p = simState.dir.power; $("#powv").textContent = p < .5 ? "살살" : p < .85 ? "보통" : "힘껏!"; clearTimeout(t._t); t._t = setTimeout(() => { render(); }, 250); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.dataset.rec){ const v = t.value === "" ? null : Number(t.value); Sync.set("students/" + t.dataset.rec + "/rec/" + t.dataset.r, v); }
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Enter"){
    if(!$("#stuForm")?.classList.contains("hidden") && $("#stuForm")) document.querySelector('[data-act="joinstu"]')?.click();
    else if($("#teachForm") && !$("#teachForm").classList.contains("hidden")) document.querySelector('[data-act="jointeach"]')?.click();
  }
});
function dirReset(){ const d = simState.dir; if(!d) return; clearTimeout(d.tid); d.launched = false; d.spinning = false; d.lastLift = 0; d.run = (d.run || 0) + 1; }
function dirStop(){ const d = simState.dir; if(!d) return; clearTimeout(d.tid); d.spinning = false; render(); }
function saveView(){ if(me) LS.set("sd_view_" + Sync.room + "_" + me.id, studentView); }

Sync.on(t => { tree = t; if(following() && studentView.ch !== (S().chapter || "welcome")){ studentView.ch = S().chapter || "welcome"; saveView(); } render(); });
renderLogin();
</script>
</body>
</html>
